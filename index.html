<canvas id="matrix-canvas"></canvas>
<div id="root"></div>
<script>
  // Matrix digital-rain background — plain canvas, independent of React,
  // so it keeps animating regardless of app state/re-renders.
  (function () {
    const canvas = document.getElementById("matrix-canvas");
    const ctx = canvas.getContext("2d");
    const glyphs = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789";
    let cols, drops, fontSize;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fontSize = window.innerWidth < 480 ? 14 : 16;
      cols = Math.floor(canvas.width / fontSize);
      drops = new Array(cols).fill(0).map(() => Math.random() * -40);
    }
    window.addEventListener("resize", resize);
    resize();

    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < cols; i++) {
        const char = glyphs[Math.floor(Math.random() * glyphs.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        // occasional white glyph for the "spark" at the head of a stream
        ctx.fillStyle = Math.random() > 0.975 ? "#ffffff" : "#00ff41";
        ctx.fillText(char, x, y);
        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    if (!reduceMotion) {
      setInterval(draw, 55);
    } else {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  })();
</script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY = "clock-log:entries";
const SHEETS_URL_KEY = "clock-log:sheets-url";
const KEYWORD_KEY = "clock-log:keyword";
const DEFAULT_KEYWORD = "log";

function loadLocal(key) {
  try {
    const v = localStorage.getItem(key);
    return v == null ? null : v;
  } catch (e) {
    return null;
  }
}

function saveLocal(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    return false;
  }
}

function formatWhen(iso) {
  const d = new Date(iso);
  const date = d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" });
  return date + " · " + time;
}

function formatDuration(ms) {
  const totalSec = Math.round(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return h + "h " + m + "m";
  if (m > 0) return m + "m " + s + "s";
  return s + "s";
}

const AUTH_KEY = "clock-log:auth";

async function hashText(text) {
  if (window.crypto && window.crypto.subtle) {
    try {
      const enc = new TextEncoder().encode(text);
      const buf = await window.crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch (e) {
      // fall through to the basic hash below
    }
  }
  // fallback for non-secure contexts (e.g. plain file:// pages) where
  // crypto.subtle isn't available — not cryptographically strong, but
  // keeps the login working everywhere.
  let h = 0;
  for (let i = 0; i < text.length; i++) {
    h = (Math.imul(31, h) + text.charCodeAt(i)) | 0;
  }
  return "fb" + (h >>> 0).toString(16);
}

function AuthGate() {
  const [authConfig, setAuthConfig] = useState(undefined); // undefined = loading, null = not set
  const [unlocked, setUnlocked] = useState(false);
  const [mode, setMode] = useState("login"); // "login" | "setup"
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");

  useEffect(() => {
    const raw = loadLocal(AUTH_KEY);
    if (raw) {
      try {
        setAuthConfig(JSON.parse(raw));
        setMode("login");
      } catch (e) {
        setAuthConfig(null);
        setMode("setup");
      }
    } else {
      setAuthConfig(null);
      setMode("setup");
    }
  }, []);

  const handleSetup = async (e) => {
    e.preventDefault();
    setError("");
    if (!username.trim() || !password) {
      setError("Enter a username and password.");
      return;
    }
    if (password !== confirmPassword) {
      setError("Passwords don't match.");
      return;
    }
    const passHash = await hashText(password);
    const config = { username: username.trim(), passHash };
    saveLocal(AUTH_KEY, JSON.stringify(config));
    setAuthConfig(config);
    setUnlocked(true);
  };

  const handleLogin = async (e) => {
    e.preventDefault();
    setError("");
    const passHash = await hashText(password);
    if (username.trim() === authConfig.username && passHash === authConfig.passHash) {
      setUnlocked(true);
    } else {
      setError("Incorrect username or password.");
      setPassword("");
    }
  };

  const handleReset = () => {
    if (window.confirm("Reset login? This clears the saved username/password (not your log entries).")) {
      try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
      setAuthConfig(null);
      setMode("setup");
      setUsername("");
      setPassword("");
      setConfirmPassword("");
      setError("");
    }
  };

  if (unlocked) return <ClockApp />;

  if (authConfig === undefined) {
    return <div className="auth-wrap"><div className="empty">loading…</div></div>;
  }

  return (
    <div className="auth-wrap">
      <h1 className="title">clock_log</h1>
      <p className="sub">{mode === "setup" ? "create your login" : "sign in to continue"}</p>

      <form className="auth-form" onSubmit={mode === "setup" ? handleSetup : handleLogin}>
        <input
          type="text"
          className="settings-input"
          placeholder="username"
          value={username}
          onChange={(e) => setUsername(e.target.value)}
          autoCapitalize="none"
          autoCorrect="off"
        />
        <input
          type="password"
          className="settings-input"
          placeholder="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
        />
        {mode === "setup" && (
          <input
            type="password"
            className="settings-input"
            placeholder="confirm password"
            value={confirmPassword}
            onChange={(e) => setConfirmPassword(e.target.value)}
          />
        )}
        {error && <div className="auth-error">{error}</div>}
        <button type="submit" className="settings-save auth-submit">
          {mode === "setup" ? "Create login" : "Log in"}
        </button>
      </form>

      {mode === "login" && (
        <button className="auth-reset" onClick={handleReset}>forgot password? reset login</button>
      )}
    </div>
  );
}

// --- weekly stats helpers ---

// pairs each "out" entry with the "in" that follows it in a newest-first
// entries array, returning completed sessions with start/end/duration
function pairSessions(entries) {
  const sessions = [];
  entries.forEach((item, idx) => {
    if (item.type === "out") {
      const pairIn = entries.slice(idx + 1).find((x) => x.type === "in");
      if (pairIn) {
        sessions.push({
          inTs: pairIn.ts,
          outTs: item.ts,
          durationMs: new Date(item.ts) - new Date(pairIn.ts),
        });
      }
    }
  });
  return sessions;
}

// returns the Sunday (local midnight) that starts the week containing ts
function weekStart(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function weekKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function formatWeekLabel(d) {
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// aggregates completed sessions into total ms per week (by the session's
// start date), sorted oldest to newest
function weeklyTotals(sessions) {
  const map = new Map();
  sessions.forEach((s) => {
    const ws = weekStart(s.inTs);
    const key = weekKey(ws);
    const existing = map.get(key);
    if (existing) {
      existing.ms += s.durationMs;
    } else {
      map.set(key, { key, weekStartDate: ws, ms: s.durationMs });
    }
  });
  return Array.from(map.values()).sort((a, b) => a.key.localeCompare(b.key));
}

function formatHoursShort(ms) {
  const totalMinutes = Math.round(ms / 60000);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  if (h === 0) return m + "m";
  if (m === 0) return h + "h";
  return h + "h " + m + "m";
}

function WeekBarChart({ weeks }) {
  const width = 600;
  const height = 230;
  const padLeft = 8;
  const padRight = 8;
  const padTop = 34;
  const padBottom = 26;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;
  const maxMs = Math.max(...weeks.map((w) => w.ms), 1);
  const barGap = 10;
  const barW = weeks.length > 0 ? Math.min(48, (plotW - barGap * (weeks.length - 1)) / weeks.length) : 0;
  const totalBarsW = weeks.length * barW + (weeks.length - 1) * barGap;
  const startX = padLeft + Math.max(0, (plotW - totalBarsW) / 2);

  const points = weeks.map((w, i) => {
    const barH = maxMs > 0 ? (w.ms / maxMs) * plotH : 0;
    const x = startX + i * (barW + barGap) + barW / 2;
    const y = padTop + plotH - barH;
    return { x, y, w };
  });
  const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p.x + " " + p.y).join(" ");
  const gridFracs = [0.25, 0.5, 0.75];

  return (
    <svg viewBox={"0 0 " + width + " " + height} xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="barCurrent" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#baffd4" />
          <stop offset="35%" stopColor="#39ff8c" />
          <stop offset="100%" stopColor="#00b82e" />
        </linearGradient>
        <linearGradient id="barPast" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#0f6b2c" />
          <stop offset="100%" stopColor="#063d19" />
        </linearGradient>
        <filter id="barGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="2.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      {gridFracs.map((f) => (
        <line
          key={f}
          x1={padLeft}
          y1={padTop + plotH * (1 - f)}
          x2={width - padRight}
          y2={padTop + plotH * (1 - f)}
          stroke="rgba(0,255,65,0.14)"
          strokeDasharray="3 5"
          strokeWidth="1"
        />
      ))}
      <line x1={padLeft} y1={padTop + plotH} x2={width - padRight} y2={padTop + plotH} stroke="rgba(255,255,255,0.5)" strokeWidth="1" />

      {points.map(({ x, y, w }, i) => {
        const barH = Math.max(padTop + plotH - y, w.ms > 0 ? 2 : 0);
        const isCurrent = i === weeks.length - 1;
        return (
          <g key={w.key} filter={isCurrent ? "url(#barGlow)" : undefined}>
            <rect
              x={x - barW / 2}
              y={padTop + plotH - barH}
              width={barW}
              height={barH}
              rx="6"
              fill={isCurrent ? "url(#barCurrent)" : "url(#barPast)"}
              stroke={isCurrent ? "#ffffff" : "rgba(0,255,65,0.35)"}
              strokeWidth={isCurrent ? 1.25 : 1}
            />
          </g>
        );
      })}

      {/* trend line across week tops */}
      <path d={linePath} fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="1.5" strokeDasharray="2 4" />
      {points.map(({ x, y, w }, i) => (
        <circle
          key={w.key + "-dot"}
          cx={x}
          cy={y}
          r={i === weeks.length - 1 ? 4 : 3}
          fill={i === weeks.length - 1 ? "#ffffff" : "#39ff8c"}
          filter="url(#dotGlow)"
        />
      ))}

      {points.map(({ x, y, w }, i) => (
        <React.Fragment key={w.key + "-labels"}>
          {w.ms > 0 && (
            <text x={x} y={y - 12} textAnchor="middle" className="chart-value-label">
              {formatHoursShort(w.ms)}
            </text>
          )}
          <text x={x} y={padTop + plotH + 18} textAnchor="middle" className="chart-bar-label">
            {formatWeekLabel(w.weekStartDate)}
          </text>
        </React.Fragment>
      ))}
    </svg>
  );
}

function StatsPage({ entries }) {
  const sessions = pairSessions(entries);
  const allWeeks = weeklyTotals(sessions);

  if (allWeeks.length === 0) {
    return <div className="empty">no completed sessions yet — clock in and out to see weekly stats</div>;
  }

  // show at most the last 8 weeks in the chart, oldest to newest
  const recentWeeks = allWeeks.slice(-8);
  const thisWeekKey = weekKey(weekStart(new Date().toISOString()));
  const thisWeek = allWeeks.find((w) => w.key === thisWeekKey);
  const thisWeekMs = thisWeek ? thisWeek.ms : 0;
  const avgMs = allWeeks.reduce((sum, w) => sum + w.ms, 0) / allWeeks.length;

  return (
    <React.Fragment>
      <div className="stats-summary">
        <div className="stats-card">
          <div className="sc-label">this week</div>
          <div className="sc-value">{formatHoursShort(thisWeekMs)}</div>
        </div>
        <div className="stats-card">
          <div className="sc-label">weekly average</div>
          <div className="sc-value">{formatHoursShort(avgMs)}</div>
        </div>
      </div>

      <div className="chart-wrap">
        <WeekBarChart weeks={recentWeeks} />
      </div>

      <div className="week-list">
        <div className="log-head">weekly totals</div>
        {allWeeks.slice().reverse().map((w) => (
          <div className={"week-row" + (w.key === thisWeekKey ? " current" : "")} key={w.key}>
            <span className="wk-label">week of {formatWeekLabel(w.weekStartDate)}</span>
            <span className="wk-total">{formatHoursShort(w.ms)}</span>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function ClockApp() {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [status, setStatus] = useState("");
  const [sheetsUrl, setSheetsUrl] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [urlDraft, setUrlDraft] = useState("");
  const [keyword, setKeyword] = useState(DEFAULT_KEYWORD);
  const [keywordDraft, setKeywordDraft] = useState(DEFAULT_KEYWORD);
  const [quickInput, setQuickInput] = useState("");
  const [view, setView] = useState("log");
  const statusTimer = useRef(null);

  useEffect(() => {
    const raw = loadLocal(STORAGE_KEY);
    if (raw) {
      try {
        setEntries(JSON.parse(raw));
      } catch (e) {
        // ignore corrupt data
      }
    }
    const savedUrl = loadLocal(SHEETS_URL_KEY);
    if (savedUrl) {
      setSheetsUrl(savedUrl);
      setUrlDraft(savedUrl);
    }
    const savedKeyword = loadLocal(KEYWORD_KEY);
    if (savedKeyword) {
      setKeyword(savedKeyword);
      setKeywordDraft(savedKeyword);
    }
    setLoaded(true);
  }, []);

  const persist = useCallback((next) => {
    const ok = saveLocal(STORAGE_KEY, JSON.stringify(next));
    if (!ok) {
      setStatus("Couldn't save — try again");
      clearTimeout(statusTimer.current);
      statusTimer.current = setTimeout(() => setStatus(""), 2500);
    }
  }, []);

  // formats a timestamp as M/D/YY, e.g. 8/29/26
  const formatDay = (iso) => {
    const d = new Date(iso);
    return (d.getMonth() + 1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(-2);
  };

  // formats a timestamp as 12-hour time with AM/PM, e.g. 7:30AM or 5:00PM
  const formatTime24 = (iso) => {
    const d = new Date(iso);
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, "0");
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12;
    if (h === 0) h = 12;
    return h + ":" + m + ampm;
  };

  const syncSessionToSheet = useCallback((inTs, outTs) => {
    if (!sheetsUrl) return;
    const payload = {
      day: formatDay(inTs),
      timeIn: formatTime24(inTs),
      timeOut: formatTime24(outTs),
    };
    // no-cors: Apps Script web apps don't return CORS headers, so the
    // response is opaque — this is a fire-and-forget send.
    fetch(sheetsUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload),
    }).catch(() => {
      setStatus("Logged locally — Sheets sync failed");
      clearTimeout(statusTimer.current);
      statusTimer.current = setTimeout(() => setStatus(""), 3000);
    });
  }, [sheetsUrl]);

  const saveSheetsUrl = useCallback(() => {
    const trimmed = urlDraft.trim();
    setSheetsUrl(trimmed);
    saveLocal(SHEETS_URL_KEY, trimmed);
    const trimmedKeyword = keywordDraft.trim() || DEFAULT_KEYWORD;
    setKeyword(trimmedKeyword);
    setKeywordDraft(trimmedKeyword);
    saveLocal(KEYWORD_KEY, trimmedKeyword);
    setStatus("Settings saved");
    clearTimeout(statusTimer.current);
    statusTimer.current = setTimeout(() => setStatus(""), 2500);
    setShowSettings(false);
  }, [urlDraft, keywordDraft]);

  // logs a plain timestamped "note" entry — triggered by typing the
  // configured keyword into the quick-log box and hitting Enter
  const logKeywordEntry = useCallback(() => {
    const entry = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      ts: new Date().toISOString(),
      type: "note",
    };
    setEntries((prev) => {
      const next = [entry, ...prev];
      persist(next);
      return next;
    });
    setStatus("Logged at " + formatWhen(entry.ts));
    clearTimeout(statusTimer.current);
    statusTimer.current = setTimeout(() => setStatus(""), 3000);
  }, [persist]);

  const handleQuickInputChange = useCallback((e) => {
    setQuickInput(e.target.value);
  }, []);

  const handleQuickInputKeyDown = useCallback((e) => {
    if (e.key !== "Enter") return;
    if (quickInput.trim().toLowerCase() === keyword.trim().toLowerCase()) {
      logKeywordEntry();
    }
    setQuickInput("");
  }, [quickInput, keyword, logKeywordEntry]);

  // find the most recent clock in/out (ignoring "note" entries from quick-log)
  // to determine whether we're currently clocked in.
  const lastClockEntry = entries.find((e) => e.type === "in" || e.type === "out");
  const currentlyIn = loaded && !!lastClockEntry && lastClockEntry.type === "in";
  const nextType = currentlyIn ? "out" : "in";

  const handleClock = useCallback(() => {
    const entry = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      ts: new Date().toISOString(),
      type: nextType,
    };
    // if we're clocking out, lastClockEntry is the matching "in" for this session
    const sessionInTs = nextType === "out" && lastClockEntry ? lastClockEntry.ts : null;
    setEntries((prev) => {
      const next = [entry, ...prev];
      persist(next);
      return next;
    });
    if (nextType === "out" && sessionInTs) {
      syncSessionToSheet(sessionInTs, entry.ts);
    }
    setStatus(
      "Clocked " + nextType.toUpperCase() + " at " + formatWhen(entry.ts) +
      (sheetsUrl && nextType === "out" ? " · syncing…" : "")
    );
    clearTimeout(statusTimer.current);
    statusTimer.current = setTimeout(() => setStatus(""), 3000);
  }, [nextType, lastClockEntry, persist, syncSessionToSheet, sheetsUrl]);

  const deleteEntry = useCallback((id) => {
    setEntries((prev) => {
      const next = prev.filter((e) => e.id !== id);
      persist(next);
      return next;
    });
  }, [persist]);

  // pair each "out" with the "in" that follows it in the (newest-first) list
  const withDurations = entries.map((item, idx) => {
    if (item.type === "out") {
      const pairIn = entries.slice(idx + 1).find((x) => x.type === "in");
      if (pairIn) {
        return { ...item, durationMs: new Date(item.ts) - new Date(pairIn.ts) };
      }
    }
    return item;
  });

  return (
    <div className="wrap">
      <div className="header-row">
        <div>
          <h1 className="title">clock_log</h1>
          <p className="sub">tap once to clock in, again to clock out</p>
        </div>
        <button className="gear-btn" onClick={() => setShowSettings((s) => !s)} aria-label="Sheets sync settings">
          ⚙
        </button>
      </div>

      <div className="tab-row">
        <button className={"tab-btn" + (view === "log" ? " active" : "")} onClick={() => setView("log")}>
          Log
        </button>
        <button className={"tab-btn" + (view === "stats" ? " active" : "")} onClick={() => setView("stats")}>
          Stats
        </button>
      </div>

      {view === "stats" ? (
        <StatsPage entries={entries} />
      ) : (
      <React.Fragment>
      {showSettings && (
        <div className="settings-panel">
          <div className="settings-label">google sheets web app url</div>
          <input
            type="text"
            className="settings-input"
            placeholder="https://script.google.com/macros/s/…/exec"
            value={urlDraft}
            onChange={(e) => setUrlDraft(e.target.value)}
          />
          <div className="settings-label" style={{ marginTop: "4px" }}>quick-log keyword</div>
          <input
            type="text"
            className="settings-input"
            placeholder="log"
            value={keywordDraft}
            onChange={(e) => setKeywordDraft(e.target.value)}
            autoCapitalize="none"
            autoCorrect="off"
          />
          <div className="settings-row">
            <button className="settings-save" onClick={saveSheetsUrl}>Save</button>
            {sheetsUrl && <span className="settings-status">syncing to sheet</span>}
          </div>
        </div>
      )}

      <div className="quick-log">
        <input
          type="text"
          className="settings-input quick-log-input"
          placeholder={'type "' + keyword + '" + enter to log the current time'}
          value={quickInput}
          onChange={handleQuickInputChange}
          onKeyDown={handleQuickInputKeyDown}
          autoCapitalize="none"
          autoCorrect="off"
        />
      </div>

      <button
        className={"clock-btn " + (currentlyIn ? "state-out" : "state-in")}
        onClick={handleClock}
        disabled={!loaded}
      >
        {currentlyIn ? "Clock Out" : "Clock In"}
      </button>
      <div className="status-line">{status}</div>

      {currentlyIn && (
        <div className="current-session">
          <div className="cs-label">currently clocked in</div>
          <div className="cs-time">since {formatWhen(lastClockEntry.ts)}</div>
        </div>
      )}

      {!loaded ? (
        <div className="empty">loading log…</div>
      ) : entries.length === 0 ? (
        <div className="empty">no entries yet — tap clock in to start</div>
      ) : (
        <div className="log-scroll">
          <div className="log-head">history</div>
          {withDurations.map((item) => (
            <div className="item" key={item.id}>
              <span className={"badge " + item.type}>{item.type}</span>
              <span className="when">{formatWhen(item.ts)}</span>
              {item.durationMs != null && (
                <span className="dur">{formatDuration(item.durationMs)}</span>
              )}
              <button className="del" onClick={() => deleteEntry(item.id)} aria-label="Delete entry">✕</button>
            </div>
          ))}
        </div>
      )}
      </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
